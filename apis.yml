name: Escale
description: 'Escale is a Sao Paulo-based sales technology company founded in 2013 that builds aisa,
  an AI sales agent trained on millions of real sales conversations. aisa automates lead qualification,
  objection handling, deal personalization, and sales closure across text and voice channels for
  enterprise brands in financial services, banking, telecommunications, automotive finance, and
  education. Escale manages the full customer-acquisition funnel from demand generation through
  closing, having processed over 7 million leads and generated more than R$2.1 billion in GMV. The
  company was surfaced as a portfolio company of QED Investors and added to the API Evangelist
  network; it publishes no public developer API, so this profile captures its corporate identity,
  trust/compliance posture, and legal properties rather than API artifacts.'
